{% extends 'base.html' %}
{% block title %}NEM extrator de textos{% endblock %}
{% block content %}
<div class="container">
    <div class="row justify-content-center aling-items-center min-vh-content">
        <div class="col-md-6">
            <div class="card p-4 shadown lg">
                <img src="{{url_for('static', filename='img/ka.png')}}" alt="logo OCR" class="img-fluid mx-auto d-block" >
                <h2 class="text-center mb-4">Extrator de textos de uma imagem</h2>
                <form action="/extrair" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="image" class="form-label">Selecione uma imagem:</label>
                        <input type="file" class="form-control" id="image" name="image" accept="image/*" required>
                    <div>
                        <button type="submit" class="btn btn-success mt-3">Extrair texto</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
